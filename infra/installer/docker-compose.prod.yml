# OBS on-premise üretim yığını (Faz 9). Tek komutla ayağa kalkar: ./install.sh
# app + PostgreSQL + Redis + MinIO + Caddy (otomatik TLS). Air-gapped uyumlu.
name: obs

services:
  app:
    image: obs-api:${OBS_VERSION:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://obs_app:${OBS_APP_DB_PASSWORD}@postgres:5432/obs
      DATABASE_MIGRATE_URL: postgres://obs:${OBS_DB_PASSWORD}@postgres:5432/obs
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: obs
      POSTGRES_PASSWORD: ${OBS_DB_PASSWORD}
      POSTGRES_DB: obs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obs -d obs"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: obs
      MINIO_ROOT_PASSWORD: ${OBS_MINIO_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OBS_DOMAIN: ${OBS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [app]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
