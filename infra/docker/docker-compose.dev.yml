# OBS geliştirme ortamı: tek komutla ayağa kalkar -> `pnpm infra:up`
# Prod/On-prem installer AYRI (infra/installer, Faz 9). Bu dosya SADECE dev içindir.
name: obs-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: obs-postgres
    environment:
      POSTGRES_USER: obs
      POSTGRES_PASSWORD: obs_dev_password
      POSTGRES_DB: obs
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obs -d obs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: obs-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: obs-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: obs
      MINIO_ROOT_PASSWORD: obs_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: obs-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
